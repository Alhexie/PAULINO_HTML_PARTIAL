<h1>Know Your Land</h1>
<p>Protect your future. Check your land before you buy, build, or sign.</p>

<svg viewBox="0 0 300 200" role="img" aria-label="Simple lot with corner markers">
  <polygon points="40,40 250,30 270,150 130,170 30,120" fill="#E0225F" fill-opacity=".15" stroke="currentColor" stroke-width="3"/>
  <rect x="35" y="35" width="10" height="10" fill="#E0225F"/>
  <rect x="245" y="25" width="10" height="10" fill="#E0225F"/>
  <rect x="265" y="145" width="10" height="10" fill="#E0225F"/>
  <rect x="125" y="165" width="10" height="10" fill="#E0225F"/>
  <rect x="25" y="115" width="10" height="10" fill="#E0225F"/>
</svg>

<h2>Why it matters</h2>
<ul>
  <li><span class="dot"></span>Boundary disputes</li>
  <li><span class="dot"></span>Fake titles</li>
  <li><span class="dot"></span>Unlicensed surveys</li>
</ul>

<h2>What a Geodetic Engineer does</h2>
<p>Surveys the land and prepares the survey plan.</p>

<p>Alhexie Yuki D. Paulino, BSGE III</p>
